apiVersion: batch/v1
kind: CronJob
metadata:
  name: fnal-sync-ferry-users
  labels:
    app: sync-ferry-users
spec:
  schedule: "30 8 */1 * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: useroot
          volumes:
          - name: rucio-config
            projected:
              defaultMode: 0644
              sources:
                - secret:
                    name: fnal-ferry-rucio-config
                    items:
                      - key: sync_ferry_config.json
                        path: sync_ferry_config.json
                - configMap:
                    name: fnal-ferry-rucio-cfg
                    items:
                      - key: rucio.cfg
                        path: rucio.cfg
          - name: proxy-volume
            secret:
              secretName: fnal-rucio-x509up
          - name: usercert
            secret:
              secretName: fnal-fts-cert
          - name: userkey
            secret:
              secretName:  fnal-fts-key
          - name: ca-volume
            persistentVolumeClaim:
              claimName: grid-certificates-pvc
          containers:
            - name: sync-ferry-users
              image: "imageregistry.fnal.gov/rucio-ams/rucio-client:38.5.5.fnal.1"
              imagePullPolicy: Always
              command:
              - /bin/bash
              - -c
              - python3 /scripts/sync_ferry_users.py --commit
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: rucio-config
                  mountPath: /opt/rucio/etc
                - name: proxy-volume
                  mountPath: /opt/proxy
                - name: ca-volume
                  mountPath: /etc/grid-security/certificates
                - name: usercert
                  mountPath: /opt/rucio/certs/
                - name: userkey
                  mountPath: /opt/rucio/keys/
              env:
                - name: FERRY_VO
                  value: "dune"
                - name: FERRY_URL
                  value: "https://ferry.fnal.gov:8445"
                - name: FERRY_SYNC_CONFIG_FILE
                  value: "/opt/rucio/etc/sync_ferry_config.json"
                - name: FERRY_TOKEN_ISS
                  value: "https://cilogon.org/dune"
                - name: CA_PATH
                  value: "/etc/grid-security/certificates"
                - name: X509_USER_PROXY
                  value: "/opt/proxy/x509up"
                - name: X509_USER_CERT
                  value: "/opt/rucio/certs/usercert.pem"
                - name: X509_USER_KEY
                  value: "/opt/rucio/keys/new_userkey.pem"
          restartPolicy: OnFailure
---
